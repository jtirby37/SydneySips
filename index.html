<style id="css">
:root{--bg:#FDF4E0;--card:#FFFBF1;--ink:#3B2A1B;--mute:#7A6650;--line:#E6D3B0;--acc:#5F6B47;--onacc:#FDF4E0;--chip:#F3E4C4;--brown:#7A5638;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B2118;--card:#382B20;--ink:#F6E9D0;--mute:#C4B08F;--line:#54402D;--acc:#B9C48F;--onacc:#26301A;--chip:#46362A;--brown:#D9B48A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2B2118;--card:#382B20;--ink:#F6E9D0;--mute:#C4B08F;--line:#54402D;--acc:#B9C48F;--onacc:#26301A;--chip:#46362A;--brown:#D9B48A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 18px 120px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
h2{font-size:26px;font-weight:600;margin:6px 0 14px;color:var(--brown)}
.sr{position:absolute;left:-9999px}
.logo{display:block;width:min(68vw,250px);height:auto;margin:0 auto 6px;border-radius:50%}
.sub{color:var(--mute);margin:4px 0 24px;text-align:center}
.gingham{height:14px;border-radius:7px;margin:0 0 18px;background-color:var(--card);background-image:linear-gradient(90deg,rgba(122,86,56,.38) 50%,transparent 50%),linear-gradient(rgba(122,86,56,.38) 50%,transparent 50%);background-size:14px 14px;border:1px solid var(--line)}
button,a.btn{font:inherit;color:inherit;border:0;cursor:pointer;text-decoration:none;display:block;width:100%;text-align:left}
.big,.row{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;font-weight:600}
.big small,.row small{display:block;font-weight:400;color:var(--mute);margin-top:2px}
.big:active,.row:active{transform:scale(.98)}
.big.off{opacity:.55}
.flash,.primary:active,.big:active,.row:active,.chip:active,.ghost:active{filter:invert(1)}
.primary{background:var(--acc);color:var(--onacc);border-radius:16px;padding:16px 18px;font-weight:700;text-align:center;margin-top:8px}
.ghost{background:transparent;color:var(--mute);text-align:center;padding:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{width:auto;background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:10px 16px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--card);color:var(--acc)}
.lbl{display:block;font-weight:700;margin:12px 0 4px}
.back{width:auto;background:none;color:var(--mute);padding:6px 0;margin-bottom:8px;font-weight:600}
.item,.ed{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item button,.ed button{width:auto;background:none;color:var(--brown);font-weight:700;padding:8px}
.in{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.ed{margin-bottom:8px}
pre{white-space:pre-wrap;font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin:10px 0 14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar .primary{max-width:444px;margin:0 auto}
.toast{text-align:center;min-height:22px;color:var(--mute)}
</style>
</head>

<script id="code">
var $=function(i){return document.getElementById(i)};
var CFG=JSON.parse($("cfg").textContent),AS=JSON.parse($("assets").textContent);
var S={view:"home",cart:[],drink:null,syrup:null,foam:null,msg:"",name:""};
var CAN=null,ART=null,D=null,app=$("app");
try{S.name=localStorage.getItem("ss_name")||""}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function getFav(){try{var v=JSON.parse(localStorage.getItem("ss_fav"));return Array.isArray(v)&&v.length?v:null}catch(e){return null}}
function setFav(x){try{localStorage.setItem("ss_fav",JSON.stringify(x))}catch(e){}}
function line(it,i){return (i+1)+". "+it.name+(it.detail.length?" ("+it.detail.join(", ")+")":"")}
function orderText(items){var n=(S.name||"").trim();return "Sydney’s Sips order"+(n?" for "+n:"")+":\n\n"+items.map(line).join("\n\n")}
function smsHref(items){return "sms:"+CFG.phone+"?&body="+encodeURIComponent(orderText(items))}
function go(v){S.view=v;S.msg="";render();window.scrollTo(0,0)}
function head(sub){return '<h1 class="sr">Sydney’s Sips</h1><img class="logo" alt="Sydney’s Sips Coffee Co." src="'+AS.logo+'"><p class="sub">'+sub+'</p><div class="gingham"></div>'}
function back(to){return '<button class="back" data-go="'+to+'">‹ Back</button>'}
function bar(){return S.cart.length&&!/^(review|home|staff)$/.test(S.view)?'<div class="bar"><button class="primary" data-go="review">Review order ('+S.cart.length+')</button></div>':""}
function sendBlock(items,id){
  return '<label class="lbl" for="nm">Name for the order</label><input class="in" id="nm" value="'+esc(S.name)+'" placeholder="Your name" autocomplete="given-name">'+
  '<pre id="ot">'+esc(orderText(items))+'</pre><a class="btn primary" id="'+id+'" href="'+smsHref(items)+'">Text my order to Sydney</a>'+
  '<button class="ghost" data-act="copy">Copy order instead</button><div class="toast">'+S.msg+'</div>';
}
function listEd(k,label){
  return '<div class="lbl">'+label+'</div>'+D[k].map(function(v,i){return '<div class="ed"><input class="in" data-k="'+k+'" data-i="'+i+'" value="'+esc(v)+'"><button data-del="'+k+':'+i+'">Remove</button></div>'}).join("")+
  '<div class="ed"><input class="in" id="new-'+k+'" placeholder="Add a name"><button data-add="'+k+'">Add</button></div>';
}
function staff(){
  if(CAN===null)return head("Staff")+'<p class="sub">Checking access…</p>';
  if(!CAN)return head("Staff")+'<p class="sub">This page is for the shop owner. Open it while signed in to the Claude account that owns the menu.</p><button class="primary" data-go="home">Open the menu</button>';
  if(!D)D=JSON.parse(JSON.stringify(CFG));
  return head("Update the menu")+listEd("specials","Sydney’s Special’s")+listEd("syrups","Syrups")+
  '<label class="lbl" for="ph">Number that gets orders</label><input class="in" id="ph" data-phone="1" value="'+esc(D.phone)+'" inputmode="tel">'+
  '<button class="primary" data-act="publish">Publish menu</button><div class="toast">'+S.msg+'</div><button class="ghost" data-go="home">Open the customer menu</button>';
}
function render(){
  var h="",fav=getFav(),v=S.view;
  if(v==="staff"){app.innerHTML=staff();return}
  if(v==="home"){
    h=head("What are we sipping today?")+
    '<button class="big" data-act="new">New order<small>Pick your drinks and text them to Sydney</small></button>'+
    '<button class="big'+(fav?'':' off')+'" data-act="reorder">Reorder favorite<small>'+(fav?fav.length+(fav.length>1?" drinks":" drink")+" from your last order":"Send an order first and it’s saved here")+'</small></button>'+
    (CAN?'<button class="ghost" data-go="staff">Staff: update the menu</button>':'');
  }else if(v==="pick"){
    h=back("home")+'<h2>What kind of drink?</h2>'+
    '<button class="row" data-drink="special">Sydney’s Special’s<small>Seasonal, made her way</small></button>'+
    '<button class="row" data-drink="americano">Americano<small>Choose a syrup and cold foam</small></button>'+
    '<button class="row" data-drink="latte">Latte<small>Choose a syrup and cold foam</small></button>';
  }else if(v==="special"){
    h=back("pick")+'<h2>Sydney’s Special’s</h2>'+(CFG.specials.length?CFG.specials.map(function(s,i){return '<button class="row" data-special="'+i+'">'+esc(s)+'</button>'}).join(""):'<p class="sub">No specials right now. Check back soon.</p>');
  }else if(v==="custom"){
    var ready=S.syrup&&S.foam;
    h=back("pick")+'<h2>'+S.drink+'</h2><div class="lbl">Syrup</div><div class="chips">'+
    CFG.syrups.map(function(s,i){return '<button class="chip" aria-pressed="'+(S.syrup===s)+'" data-syrup="'+i+'">'+esc(s)+'</button>'}).join("")+
    '</div><div class="lbl">Cold foam?</div><div class="chips">'+
    ["Yes","No"].map(function(s){return '<button class="chip" aria-pressed="'+(S.foam===s)+'" data-foam="'+s+'">'+s+'</button>'}).join("")+
    '</div><button class="primary" style="opacity:'+(ready?1:.45)+'" data-act="addcustom">Add to order</button>';
  }else if(v==="added"){
    h=head("Added to your order.")+'<button class="big" data-go="pick">Add another drink</button><button class="primary" data-go="review">Review order ('+S.cart.length+')</button>';
  }else if(v==="review"){
    h=back("pick")+'<h2>Your order</h2>'+S.cart.map(function(it,i){
      return '<div class="row item"><div>'+esc(it.name)+'<small>'+esc(it.detail.join(" · "))+'</small></div><button data-rm="'+i+'">Remove</button></div>'}).join("");
    h+=S.cart.length?sendBlock(S.cart,"send")+'<button class="ghost" data-act="clear">Start over</button>':'<p class="sub">Nothing here yet.</p><button class="primary" data-go="pick">Add a drink</button>';
  }else if(v==="reorder"){
    h=back("home")+'<h2>Reorder favorite</h2>'+sendBlock(fav||[],"sendfav")+'<button class="ghost" data-act="new">Start a new order instead</button>';
  }
  app.innerHTML=h+bar();
}
function buildDoc(c){
  var t=function(i){return $(i).textContent},ic=JSON.parse(t("assets")).icon;
  return '<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><title>Sydney’s Sips</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sydney’s Sips"><link rel="apple-touch-icon" href="'+ic+'"><link rel="icon" href="'+ic+'"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet"><style id="css">'+t("css")+'</style></head><body><main id="app"></main><script type="application/json" id="cfg">'+JSON.stringify(c).replace(/</g,"\\u003c")+'<\/script><script type="application/json" id="assets">'+t("assets")+'<\/script><script id="code">'+t("code")+'<\/script></body></html>';
}
async function publish(){
  var c={phone:(D.phone||"").replace(/[^\d+]/g,""),specials:D.specials.map(function(s){return s.trim()}).filter(Boolean),syrups:D.syrups.map(function(s){return s.trim()}).filter(Boolean)};
  if(c.phone.length<10){S.msg="Enter a full phone number.";render();return}
  if(!c.syrups.length){S.msg="Keep at least one syrup.";render();return}
  if(!ART){S.msg="Publishing isn’t available in this view.";render();return}
  S.msg="Publishing…";render();
  try{await ART.publish(buildDoc(c));S.msg="Published."}
  catch(e){S.msg=e&&e.code==="conflict"?"Someone else just published. The page will reload with their version.":"Couldn’t publish ("+((e&&(e.code||e.message))||"error")+"). Your edits are still here.";render()}
}
function launchSms(a){
  var items=S.view==="reorder"?(getFav()||[]):S.cart,txt=orderText(items);
  try{navigator.clipboard.writeText(txt)}catch(x){}
  try{if(window.top!==window)window.open(a.href,"_blank");else location.href=a.href}catch(x){}
  setTimeout(function(){if(!document.hidden){S.msg="Messages didn’t open. Your order is copied: open Messages, text Sydney and paste it.";render()}},1200);
}
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="nm"){S.name=t.value;try{localStorage.setItem("ss_name",t.value)}catch(x){}
    var items=S.view==="reorder"?(getFav()||[]):S.cart;$("ot").textContent=orderText(items);var a=$("send")||$("sendfav");if(a)a.href=smsHref(items)}
  else if(t.dataset.k){D[t.dataset.k][+t.dataset.i]=t.value}
  else if(t.dataset.phone){D.phone=t.value}
});
app.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-act],[data-drink],[data-special],[data-syrup],[data-foam],[data-rm],[data-del],[data-add],#send,#sendfav");
  if(!t)return;
  var d=t.dataset;
  t.classList.add("flash");setTimeout(function(){t.classList.remove("flash")},700);
  if(t.id==="send"||t.id==="sendfav"){e.preventDefault();if(t.id==="send")setFav(S.cart.slice());launchSms(t);return}
  e.preventDefault();
  if(d.go){if(d.go==="staff")location.hash="staff";else{if(S.view==="staff")location.hash="menu";go(d.go)}}
  else if(d.drink){S.syrup=null;S.foam=null;if(d.drink==="special")go("special");else{S.drink=d.drink==="latte"?"Latte":"Americano";go("custom")}}
  else if(d.special!==undefined){S.cart.push({name:"Sydney’s Special: "+CFG.specials[+d.special],detail:[]});go("added")}
  else if(d.syrup!==undefined){S.syrup=CFG.syrups[+d.syrup];render()}
  else if(d.foam){S.foam=d.foam;render()}
  else if(d.rm!==undefined){S.cart.splice(+d.rm,1);render()}
  else if(d.del){var p=d.del.split(":");D[p[0]].splice(+p[1],1);render()}
  else if(d.add){var inp=$("new-"+d.add);if(inp.value.trim()){D[d.add].push(inp.value.trim());render()}}
  else if(d.act==="new"){S.cart=[];go("pick")}
  else if(d.act==="reorder"){if(getFav())go("reorder")}
  else if(d.act==="addcustom"){if(S.syrup&&S.foam){S.cart.push({name:S.drink,detail:["Syrup: "+S.syrup,"Cold foam: "+S.foam]});go("added")}}
  else if(d.act==="clear"){S.cart=[];go("home")}
  else if(d.act==="publish"){publish()}
  else if(d.act==="copy"){
    var txt=orderText(S.view==="reorder"?(getFav()||[]):S.cart),m="Couldn’t copy. Press and hold the order to copy it.";
    try{navigator.clipboard.writeText(txt).then(function(){S.msg="Copied. Paste it into Messages.";render()},function(){S.msg=m;render()})}catch(err){S.msg=m;render()}
  }
});
function route(){if(location.hash==="#staff")S.view="staff";else if(S.view==="staff")S.view="home";render()}
window.addEventListener("hashchange",route);
route();
try{fetch("menu.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.phone&&j.specials&&j.syrups){CFG=j;render()}}).catch(function(){})}catch(e){}
if(window.claude&&claude.use){
  claude.use("user").then(function(u){CAN=!!(u&&u.canEdit&&u.canEdit());render()},function(){CAN=false;render()});
  claude.use("artifact").then(function(a){ART=a},function(){});
}else{CAN=false;render()}
</script>
</body>
</html>
